<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="./">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required pattern="\d{3}.\d{3}.\d{3}-\d{2}" placeholder="000.000.000-00">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade">

        <label for="dataNasc">Data de Nascimento</label>
        <input type="date" id="dataNasc" name="dataNasc">
    
        <div>
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Li e aceito os termos e condições</label>
        </div>

        <div>
            <label for="parcelas">Parcelas</label>
            <select name="parcelas" id="parcelas">
                <option value="1x">1x de R$ 500,00</option>
                <option value="2x">2x de R$ 250,00</option>
                <option value="3x">3x de R$ 166,67</option>
                <option value="4x">4x de R$ 125,00</option>
                <option value="5x">5x de R$ 100,00</option>
            </select>

        </div>

    <button type="submit">Enviar</button>
    </form>
</body>
</html>
